server:
  port: 8080
  mode: release          # debug | release

database:
  path: data/gateway.db  # SQLite 文件路径，目录需可写

log:
  level: info            # debug | info | warn | error
  format: json           # json | text

auth:
  # 用于签名 Session Cookie，生产环境必须替换为随机字符串
  # 生成命令：openssl rand -hex 32
  session_secret: "REPLACE_WITH_RANDOM_SECRET"
  session_max_age: 86400  # Session 有效期（秒），默认 24 小时
  code_expiry: 5m         # 验证码有效期
  admin_itcode: "admin001"  # 首次启动自动创建管理员账号
  send_code_url: ""          # 邮件发送接口 URL，为空时仅打印日志
  invite_code: ""            # 注册邀请码，为空时不校验

usage_sync_time: 5m       # 使用量聚合间隔

# 每日全局费用上限（所有用户共享，0 = 不限）
# backend_daily_max: 10.0

# 指定 itcode 的个人每日费用上限（优先级最高，可突破全局上限）
# 若某 itcode 同时匹配此列表，则直接使用这里的值，忽略全局上限和数据库中的用户配额。
# backend_daily_usd / aws_daily_usd 设为 0 表示该渠道不做覆盖，仍走默认逻辑。
# user_daily_limits:
#   - itcode: "zhangsan"
#     backend_daily_usd: 50.0   # Backend 渠道每日上限 $50
#     aws_daily_usd: 0           # AWS 渠道不覆盖，走默认逻辑
#   - itcode: "lisi"
#     backend_daily_usd: 20.0
#     aws_daily_usd: 30.0

# 用户分组（用于费用统计和用户管理）
groups:
  - id: 1
    name: "研发组"
  - id: 2
    name: "产品组"
  - id: 3
    name: "运营组"

backends:
  # 主要后端（权重越高，分配流量越多）
  - name: claude-primary
    url: https://api.anthropic.com
    api_key: "sk-ant-api03-YOUR_KEY_HERE"
    weight: 10
    enabled: true

  # 备用后端（可选，多后端自动负载均衡）
  # - name: claude-secondary
  #   url: https://api.anthropic.com
  #   api_key: "sk-ant-api03-ANOTHER_KEY"
  #   weight: 5
  #   enabled: true

# backend 渠道模型计费（glob 匹配，单位 USD/1M tokens）
# 无匹配时使用内置默认价格（input: 3.0, output: 15.0）
# backend_model_pricing:
#   "*haiku*":
#     input: 1.00
#     output: 5.00
#   "*sonnet*":
#     input: 3.00
#     output: 15.00
#   "*opus*":
#     input: 5.00
#     output: 25.00

# AWS Bedrock 渠道（可选）
# aws:
#   region: us-west-2
#   access_key_id: AKIAIOSFODNN7EXAMPLE
#   secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
#   # SOCKS5 代理，支持以下格式（留空则直连）：
#   #   user:pass@host:port
#   #   socks5://user:pass@host:port
#   #   host:port（无认证）
#   socks5: ""
#   cache_enabled: 0
#   cache_ttl: 5m
#   model_replace:
#     claude-3-5-sonnet-20241022: arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0
#   model_default:
#     "claude-3-5-*": claude-3-5-sonnet-20241022
