server:
  port: 8080
  mode: release          # debug | release

database:
  path: data/gateway.db  # SQLite 文件路径，目录需可写

log:
  level: info            # debug | info | warn | error
  format: json           # json | text

auth:
  # 用于签名 Session Cookie，生产环境必须替换为随机字符串
  # 生成命令：openssl rand -hex 32
  session_secret: "REPLACE_WITH_RANDOM_SECRET"
  session_max_age: 86400  # Session 有效期（秒），默认 24 小时
  code_expiry: 5m         # 验证码有效期
  admin_itcode: "admin001"  # 首次启动自动创建管理员账号
  send_code_url: ""          # 邮件发送接口 URL，为空时仅打印日志
  invite_code: ""            # 注册邀请码，为空时不校验

usage_sync_time: 5m       # 使用量聚合间隔

# 每日全局费用上限（所有用户共享，0 = 不限）
# backend_daily_max: 10.0

# 指定 itcode 的个人每日费用上限（仅 AWS 渠道生效；backend 渠道限额只认
# 数据库 user_quota_overrides，此处的 backend_daily_usd 会被忽略）。
# aws_daily_usd / aws_monthly_usd 设为 0 表示不做覆盖，走默认逻辑。
# user_daily_limits:
#   - itcode: "zhangsan"
#     backend_daily_usd: 50.0   # Backend 渠道每日上限 $50
#     aws_daily_usd: 0           # AWS 渠道不覆盖，走默认逻辑
#   - itcode: "lisi"
#     backend_daily_usd: 20.0
#     aws_daily_usd: 30.0

# 各 Backend 的每日费用上限（仅用于 /admin/backends 页面的展示与监控，不影响路由）
# 匹配方式二选一：
#   - name：与下方 backends[].name 精确匹配
#   - prefix：按后端名前缀匹配，作用于所有以该前缀开头的后端
#     （如 prefix: "lianxiang-" 会命中 lianxiang-sc031、lianxiang-sc032 ...）
# 精确 name 优先于 prefix；多个 prefix 命中时取最长（最具体）的那个。
# backend_daily_usd 为 0 或缺省表示该后端不限额；未匹配到任何条目的后端视为无上限。
# backend_daily_limits:
#   - name: "claude-primary"
#     backend_daily_usd: 100.0
#   - prefix: "lianxiang-"
#     backend_daily_usd: 5000.0
#   - prefix: "dasheng-"
#     backend_daily_usd: 400.0

# 用户分组（用于费用统计和用户管理）
groups:
  - id: 1
    name: "研发组"
  - id: 2
    name: "产品组"
  - id: 3
    name: "运营组"

backends:
  # 主要后端（权重越高，分配流量越多）
  - name: claude-primary
    url: https://api.anthropic.com
    api_key: "sk-ant-api03-YOUR_KEY_HERE"
    weight: 10
    enabled: true

  # 备用后端（可选，多后端自动负载均衡）
  # - name: claude-secondary
  #   url: https://api.anthropic.com
  #   api_key: "sk-ant-api03-ANOTHER_KEY"
  #   weight: 5
  #   enabled: true

# backend 渠道模型计费（glob 匹配，单位 USD/1M tokens）
# 无匹配时使用内置默认价格（input: 3.0, output: 15.0）
# backend_model_pricing:
#   "*haiku*":
#     input: 1.00
#     output: 5.00
#     cache_read: 0.10    # 缺省时按 input 的 10% 计
#     cache_write: 1.25   # 缺省时按 input 的 125% 计
#   "*sonnet*":
#     input: 3.00
#     output: 15.00
#     cache_read: 0.30
#     cache_write: 3.75
#   "*opus*":
#     input: 5.00
#     output: 25.00
#     cache_read: 0.50
#     cache_write: 6.25

# AWS Bedrock 渠道（可选）
# aws:
#   region: us-west-2
#   access_key_id: AKIAIOSFODNN7EXAMPLE
#   secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
#   # SOCKS5 代理，支持以下格式（留空则直连）：
#   #   user:pass@host:port
#   #   socks5://user:pass@host:port
#   #   host:port（无认证）
#   socks5: ""
#   cache_enabled: 0
#   cache_ttl: 5m
#   model_replace:
#     claude-3-5-sonnet-20241022: arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0
#   model_default:
#     "claude-3-5-*": claude-3-5-sonnet-20241022
#   # 模型能力表（可热加载，SIGHUP 生效）
#   # 按顺序匹配 match 子串（不区分大小写，同时匹配 ARN 与请求模型名）：
#   #   thinking: "adaptive" -> 新模型，thinking.type=enabled 自动转为 adaptive + output_config.effort
#   #   thinking: "legacy"   -> 旧模型，保留 enabled 写法
#   #   output_config: true  -> 允许透传 output_config（仅 adaptive 模型）
#   # 未命中回退安全默认：legacy + output_config 不透传。
#   model_capabilities:
#     - { match: "opus-4",   thinking: "adaptive", output_config: true }
#     - { match: "sonnet-4", thinking: "legacy",   output_config: false }
#     - { match: "haiku-4",  thinking: "legacy",   output_config: false }
#   # 顶层字段白名单（可热加载）——只转发列出的字段，其余剥离，
#   # 防止 diagnostics/stream/context_management 等触发 Bedrock 校验错误。
#   # 留空使用内置默认（同下列表）。metadata/model 故意不在白名单内。
#   allowed_body_fields:
#     - anthropic_version
#     - messages
#     - system
#     - max_tokens
#     - temperature
#     - top_p
#     - top_k
#     - stop_sequences
#     - tools
#     - tool_choice
#     - thinking
#     - output_config

# ─────────────────────────────────────────────────────────────────────────────
# 流量离线滥用分析（feature 004）。旁路批处理：check --analyze 拉取待分析队列，
# 规则优先分类，规则拿不准才调用 Haiku 兜底，结论回写 usage_logs。
# 原始 messages 不落库，仅存压缩信号，回写后即删。
# enabled=false（默认）时代理侧完全跳过信号抽取/入队，零开销。
# analyze:
#   enabled: true
#   haiku_base_url: ""                          # 留空则直接命中一个可用 backend 节点（用该节点自身的 url + api_key，绕过网关）；填值则走该地址 + haiku_api_key
#   haiku_api_key: "<内部分析专用网关 key>"     # 仅当 haiku_base_url 非空时使用；两者皆空则纯规则模式，不做 Haiku 兜底
#   haiku_model: "claude-haiku-4-5-20251001"
#   analyzer_ua: "claude-gateway-analyzer"      # 代理据此识别分析器自身请求并跳过入队（防自递归）
#   batch_size: 500                              # 每批拉取的待分析记录数
#   max_retry: 3                                 # Haiku 兜底失败重试上限，超过则跳过
#   score:                                       # 滥用评分权重（读时计算，改后即时生效）
#     non_work: 0.7                              # 非工作任务占比权重
#     volume: 0.3                                # 超基线任务量权重
#     baseline_tasks: 60                         # 逻辑任务基线，仅超出部分计入 volume
#     threshold: 0.5                             # 评分 ≥ 阈值进人工复核队列（仅识别不处罚）

# ─────────────────────────────────────────────────────────────────────────────
# Token 归口（attribution）。attr_side/attr_group 由 cmd/orgimport 批量导入，
# 也可在「算力洞察 → 组织管理」页逐人下拉设置负责人。
# attribution_labels: 两条业务线的显示名（不入库）。
# attribution_leaders: 组织管理页「负责人」下拉的可选项，每个负责人带所属业务线 side。
#   选中负责人时同时写入 users.attr_group(=name) 与 users.attr_side(=side)。
# attribution_labels:
#   shen: "ASDC&SWS&NBC"
#   non: "SMB"
# attribution_leaders:
#   - name: "Kavin CL7 Lu"
#     side: shen
#   - name: "John Zhang"
#     side: non

# ─────────────────────────────────────────────────────────────────────────────
# 网关模拟 web_search server tool（仅 backend 渠道）。
# Claude Code 声明 Anthropic 的 web_search_20250305 server tool，但 backend 上游
# 是第三方 Anthropic 兼容中转，不支持该 server tool。启用后网关会：把 server tool
# 改写成普通 client tool 转发上游 → 拦截模型的 web_search 调用 → 调 SearXNG 搜索 →
# 结果回填继续请求，循环到无搜索或达 max_uses → 最后向客户端输出原生
# server_tool_use + web_search_tool_result 块，Claude Code 无需改动即可渲染。
# enabled=false（默认）时代理侧完全不拦截 web_search。
# websearch:
#   enabled: true
#   provider: searxng
#   search_url: "https://searxng.example.com/search"
#   authorization: "Bearer <token>"      # 原样放入 Authorization 头
#   language: "zh-CN"                     # 默认语言，可被请求覆盖
#   max_results: 8                        # 每次搜索返回给模型的条数
#   snippet_max_chars: 800                # 每条结果 content 截断长度
#   timeout: 10s                          # SearXNG 请求超时
#   default_max_uses: 5                   # 请求未指定 max_uses 时的上限
